site_name: विचारालय
site_url: https://vicharalaya.vagvibha.org/
# repo_url: https://github.com/vagvibha/<repo>   # optional: adds a repo link in the header
docs_dir: contents

# No nav: block on purpose. The nav is built from the folders under
# contents/, and each page's title comes from its first "# heading".
# Folder names are English; their Sanskrit labels come from
# extra.section_titles below (applied by scripts/mkdocs_hooks.py).

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  language: sa
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/custom.css

extra:
  # Nav label for each folder under contents/, keyed by its path.
  # A folder not listed here shows its own name ("essays" -> "Essays").
  # Sub-folders work too, e.g.  essays/tools: उपकरणानि
  section_titles:
    essays: निबन्धाः
    reviews: समीक्षाः
    thoughts: विचाराः

plugins:
  - search
  # Blog: posts live in contents/thoughts/posts/, the post list is
  # contents/thoughts/index.md. Each post needs a `date:` in its
  # frontmatter; give it a `slug:` too, for a readable URL.
  - blog:
      blog_dir: thoughts
      post_url_format: "{slug}"
      post_date_format: MM-dd-yyyy
      archive_date_format: yyyy

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  # Quote blocks:   /// ii        (in = indent, ii = indent + italic,
  #                 quote text     ih = indent + highlight)
  #                 ///
  - pymdownx.blocks.admonition:
      types: [in, ii, ih]
  - toc:
      permalink: true
